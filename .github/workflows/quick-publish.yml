name: Quick Publish

on:
  workflow_dispatch:
    inputs:
      type:
        description: Content type
        required: true
        default: thought
        type: choice
        options:
          - thought
          - post
      content:
        description: Markdown content
        required: true
        type: string
      title:
        description: Post title
        required: false
        type: string
      tags:
        description: Comma- or newline-separated tags
        required: false
        type: string
      slug:
        description: Optional URL slug
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: quick-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the blog
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Create the Jekyll content file
        id: build
        env:
          QUICK_PUBLISH_TYPE: ${{ inputs.type }}
          QUICK_PUBLISH_CONTENT: ${{ inputs.content }}
          QUICK_PUBLISH_TITLE: ${{ inputs.title }}
          QUICK_PUBLISH_TAGS: ${{ inputs.tags }}
          QUICK_PUBLISH_SLUG: ${{ inputs.slug }}
        shell: bash
        run: |
          published_path="$(ruby scripts/quick_publish.rb)"
          echo "path=$published_path" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        env:
          CONTENT_TYPE: ${{ inputs.type }}
          PUBLISHED_PATH: ${{ steps.build.outputs.path }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PUBLISHED_PATH"
          git commit -m "quick-publish: publish $CONTENT_TYPE"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
