name: Quick Add Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to add
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: quick-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  add-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the blog
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Add the tag
        env:
          QUICK_ADD_TAG: ${{ inputs.tag }}
        run: ruby scripts/quick_add_tag.rb

      - name: Commit and push when needed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if git diff --quiet -- _data/quick_publish_tags.yml; then
            echo "Tag already exists; nothing to commit."
            exit 0
          fi

          git config user.name "weijianduan"
          git config user.email "weijianduan0302@gmail.com"
          git add -- _data/quick_publish_tags.yml
          git commit -m "quick-publish: add tag"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
